name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Verify tag and source version
        shell: pwsh
        run: ./scripts/Test-ReleaseVersion.ps1 -Tag '${{ github.ref_name }}' -RequireCleanTree -RequireHeadTag
      - name: Install MiSans for the embedded Chinese UI
        shell: pwsh
        run: ./scripts/Install-MiSans.ps1 -AcceptLicense
      - name: Build and verify package
        shell: pwsh
        run: ./scripts/Publish-RustNative.ps1
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: >-
          gh release create '${{ github.ref_name }}'
          artifacts/release/CastModelMerger-win-x64.zip
          artifacts/release/CastModelMerger-win-x64.zip.sha256
          --verify-tag
          --title 'Cast Model Merger GUI ${{ github.ref_name }}'
          --notes-file 'docs/release-notes/${{ github.ref_name }}.md'
