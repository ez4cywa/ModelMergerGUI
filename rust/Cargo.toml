[workspace]
members = [
    "crates/cast-codec",
    "crates/model-merger-engine",
    "crates/model-merger-worker",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.96"

[workspace.dependencies]
cast-codec = { path = "crates/cast-codec" }
model-merger-engine = { path = "crates/model-merger-engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
